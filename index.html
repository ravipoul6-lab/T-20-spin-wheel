<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>T20 Spin Wheel Online</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏏</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
<main>
<h1>T20 Spin Wheel Online</h1>
<p class="sub">60 players, 4 special segments, 2x slot aur Steal. Do log alag-alag device se khelte hain. Wheel dono ko live dikhta hai, lekin aapke chune hue stats game khatam hone tak sirf aapko dikhte hain.</p>
<div id="msg" class="card" style="display:none;margin-bottom:14px"></div>
<div id="lobby" class="card" style="margin-bottom:14px"><div class="pname">Online 2-player game</div><p class="hint" id="lb"></p><div id="lbtn"></div></div>
<div id="share" class="card" style="display:none;margin-bottom:14px"></div>
<div class="grid" id="game" style="display:none">
  <div class="card">
    <div class="turn" id="turn"></div>
    <div class="wheelbox"><div class="ptr"></div><canvas id="wheel" width="840" height="840"></canvas></div>
    <button class="spin" id="spin">SPIN</button>
    <div class="left" id="left"></div>
  </div>
  <div>
    <div class="card" id="pick" style="margin-bottom:16px"></div>
    <div class="card table-wrap"><table id="board"></table><p class="hint" id="bh" style="margin:8px 0 0"></p></div>
  </div>
</div>
</main>
<script type="module" src="/src/main.js"></script>
</body>
</html>
